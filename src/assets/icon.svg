<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Close Multiple Tabs</title>
  <!-- A tab with a close mark cut out, and the dashed outline of the tabs around it that get closed too. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#536dfe"/>
      <stop offset="1" stop-color="#6a3de8"/>
    </linearGradient>
    <mask id="close" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="228" y="210.5" width="116" height="31" transform="rotate(45 286 226)"/>
      <rect x="228" y="210.5" width="116" height="31" transform="rotate(-45 286 226)"/>
    </mask>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Drawn on a 512 grid, centered and scaled to the 128 canvas. -->
  <g transform="translate(64 64) scale(0.2875) translate(-256 -256)" fill="#53ff00">
    <rect x="167" y="107" width="238" height="238" rx="27" mask="url(#close)"/>
    <rect x="107" y="167" width="29" height="59"/>
    <rect x="107" y="256" width="29" height="60"/>
    <path d="M107 346H136V376H166V405H136A29 29 0 0 1 107 376Z"/>
    <rect x="196" y="376" width="60" height="29"/>
    <rect x="286" y="376" width="59" height="29"/>
  </g>
</svg>
